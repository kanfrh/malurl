services:
  malurl:
    build:
      context: .
      args:
        # 国内构建必配：否则 pip 连 files.pythonhosted.org 会超时
        # CI 里用 docker build . 直接构建，走 Dockerfile 默认的官方源
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: malurl:0.1.0
    container_name: malurl
    ports:
      - "8000:8000"
    environment:
      MALURL_THRESHOLD: "0.5"
      MALURL_HIGH_RISK: "0.8"
      MALURL_API_KEY: ""           # 生产环境务必设置
      MALURL_LOG_URLS: "true"
      MALURL_MAX_BATCH: "500"
    volumes:
      # 判定日志持久化；模型已烘焙进镜像，要换模型请覆盖 MALURL_MODEL_PATH 并自行挂载
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
