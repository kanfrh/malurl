name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试与依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试
        run: pytest -q

      - name: 依赖漏洞扫描
        # 只做报告，不阻断流水线；有高危漏洞时需要人工确认
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true

  docker:
    name: 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t malurl:ci .

      - name: 启动并验证健康检查
        run: |
          docker run -d --name malurl-ci -p 8000:8000 malurl:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/healthz; then
              echo "服务已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "服务启动失败，输出容器日志："
          docker logs malurl-ci
          exit 1

      - name: 冒烟测试
        run: |
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"urls":["http://secure-paypal.tk/login.php"]}' | tee result.json
          grep -q '"label"' result.json

      - name: 清理
        if: always()
        run: docker rm -f malurl-ci || true
