[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malurl"
version = "0.1.0"
description = "基于机器学习的恶意 URL 检测服务（可部署版）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "joblib>=1.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26"]

[project.scripts]
malurl = "malurl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
